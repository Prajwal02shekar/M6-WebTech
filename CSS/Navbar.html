<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbarContainer {
            height: 50px;
            width: 100%;
            background: linear-gradient(to right, #0a2a88, #59cde9);
            display: flex;
        }

        .navbarContainer .logo {
            height: 50px;
            background-color: red;
            flex-basis: 15%;
        }

        .navbarContainer .menu {
            height: 50px;
            background-color: greenyellow;
            flex-basis: 50%;
        }

        .navbarContainer .icons {

            height: 50px;
            background-color: magenta;
            flex-basis:35% ;
        }
    </style>
</head>

<body>
    <nav class="navbarContainer">
        <aside class="logo"></aside>
        <aside class="menu"></aside>
        <aside class="icons"></aside>

    </nav>
</body>

</html>
