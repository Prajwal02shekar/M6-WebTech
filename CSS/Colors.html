<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section {
            height: 400px;
            width: 400px;
            border-width: 10px;
            border-style: solid;
            border-color: brown;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
        }

        aside {
            height: 100px;
            width: 100px;
            border: 2px solid;
        }

        #box1 {
            background-color: orangered;
        }

        #box2 {
            background-color: #fbff00;
        }

        #box3 {
            background-color:rgb(206, 4, 172) ;
        }

        #box4 {
            background-color: rgba(206, 4, 172,0.8);
        }

        #box5 {
            background-color: hsl(91, 60%, 40%);
        }

        #box6 {
            background-color: hsla(91, 60%, 40%, 0.11);
        }

    </style>
</head>

<body>
    <section>
        <aside id="box1"></aside>
        <aside id="box2"></aside>
        <aside id="box3"></aside>
        <aside id="box4"></aside>
        <aside id="box5"></aside>
        <aside id="box6"></aside>

    </section>
</body>

</html>
