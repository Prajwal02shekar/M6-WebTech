<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 100px;
            width: 100%;
            border: 2px solid red;
        }
        div aside{
            height: 100px;
            width: 100px;
            background-color: aqua;
            border-radius: 50%;
            animation: task2 5s linear 1s infinite ;
        }
        @keyframes task2 {
            0%{
                transform: translateX(0)

            }
            100%{
                transform: translateX(1000px);
            }
        }
    </style>
</head>
<body>
    <div>
        <aside></aside>
    </div>
</body>
</html>
