<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            height: 400px;
            width: 400px;
            border: 2px solid red;
            position: relative;
        }

        .child {
            height: 100px;
            width: 100px;
            border: 2px solid;
        }

        aside:first-child {
            background-color: aqua;
            /* position: relative;
            left: 200px;
            top: 150px; */
            position: absolute;
            right: 0;
        }

        aside:nth-child(2) {
            background-color: yellow;
            position: absolute;
            right: 0;
            bottom: 0;
        }

        aside:nth-child(3) {
            background-color: red;
            position: absolute;
            bottom: 0;
        }

        aside:nth-child(4) {
            background-color: deepskyblue;
            position: absolute;
            top: 0;
        }

        aside:last-child {
            background-color: black;
            position: absolute;
            /* top: 175px;
            left:480px; */
            top: 35%;
            left: 35%;
        }
    </style>
</head>

<body>
    <div class="container">
        <aside class="child"></aside>
        <aside class="child"></aside>
        <aside class="child"></aside>
        <aside class="child"></aside>
        <aside class="child"></aside>
    </div>
</body>

</html>
