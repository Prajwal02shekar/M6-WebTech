<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>SignUp</legend>
            <label for="email">Enter Email:</label>
            <input type="email" id="email" name="email" placeholder="name@gmail.com">
            <br><br>
            <label for="username">Enter Username:</label>
            <input type="text" id="username" name="username" placeholder="Your Name">
            <br><br>
            <label for="password">Enter Password:</label>
            <input type="password" id="password" name="password" placeholder="*********">
            <br><br>
            <label for="phNum">Ph Number:</label>
            <input type="tel" minlength="10" maxlength="10" id="phNum" name="phNum" placeholder="10 digit number">
            <br><br>
            <label for="age">Enter Age:</label>
            <input type="number" id="age" name="age" placeholder="24">
            <br><br>
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" placeholder="DD-MM-YYYY">
            <br><br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
<script src="./script/register.js"></script>

</html>
